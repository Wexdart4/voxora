name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build Release Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: voxora-cli-linux-x86_64
            asset_name: voxora-cli-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: voxora-cli-windows-x86_64.exe
            asset_name: voxora-cli-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: voxora-cli-macos-x86_64
            asset_name: voxora-cli-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Binary
        run: cargo build --release --bin voxora-cli --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/voxora-cli ${{ matrix.asset_name }}

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Copy-Item target/${{ matrix.target }}/release/voxora-cli.exe -Destination ${{ matrix.asset_name }}

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.SECRET_TOKEN }}

  publish-crates:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Test Suite
        run: cargo test --workspace

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p voxora-math --no-verify
          cargo publish -p voxora-core --no-verify
          cargo publish -p voxora-vision --no-verify
          cargo publish -p voxora-geometry --no-verify
          cargo publish -p voxora-reconstruction --no-verify
          cargo publish -p voxora-render --no-verify
          cargo publish -p voxora --no-verify
          cargo publish -p voxora-cli --no-verify
